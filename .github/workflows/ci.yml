name: ci

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly: surface clippy_utils / rustc_private drift within a week even
    # with no commits. Also the only run that includes macOS: the lints are
    # platform independent and the mac runners are slower, so PRs get Linux.
    - cron: "0 6 * * 1"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain pins the nightly; rustup resolves it on first cargo use.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      # Mordant lints itself, through the binaries `cargo test` just built.
      - run: target/debug/cargo-mordant mordant --all-targets
        env:
          MORDANT_RUSTFLAGS: -D warnings

  macos:
    if: github.event_name == 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: target/debug/cargo-mordant mordant --all-targets
        env:
          MORDANT_RUSTFLAGS: -D warnings
