[target.'cfg(all())']
rustflags = ["-C", "linker=dylint-link"]

# For Rust versions 1.74.0 and onward, the following alternative can be used
# (see https://github.com/rust-lang/cargo/pull/12535):
# linker = "dylint-link"

# Keep Cargo's old build-dir layout. From nightly-2026-09-01 Cargo links a
# library into `target/<profile>/build/<pkg>/<hash>/out/` instead of
# `target/<profile>/deps/`. `dylint-link` writes its `lib<name>@<toolchain>`
# copy next to the linked file, stepping out of the folder only when it is
# named `deps`, so under the new layout the copy misses `target/<profile>/`,
# where `dylint_testing` and `cargo dylint` look for it. Remove this once
# `dylint-link` handles the new layout.
[unstable]
build-dir-new-layout = false
